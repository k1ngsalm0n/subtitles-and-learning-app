# JS and Python unit tests on every push and pull request.
#
# JS: Node's built-in runner, no install step — the project deliberately has
# no third-party Node deps.
#
# Python: the tests import torch and transformers (through translate.py) but
# never load a model, so this installs the locked packages and nothing else —
# no Whisper or NLLB download. They pass with an empty, offline model cache;
# HF_HUB_OFFLINE keeps it that way, so a test that starts reaching for a model
# fails here instead of quietly downloading gigabytes. uv's cache is keyed on
# uv.lock, so the torch wheel is only fetched again when the lockfile changes.
#
# Both run in the one `test` job because that is the check `main` requires.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --python 3.14
      - run: uv run --frozen python -m unittest discover -s test -p "test_*.py"
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'

  # The pages themselves, in a real browser at phone and desktop sizes
  # (browser-tests/). Playwright lives in its own venv, not uv.lock: adding a
  # package to the lock with `uv add` silently reverts torch to the CPU build,
  # and the app itself never needs a browser.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      # The full CC-CEDICT: the phone edition's pinyin and conversions are
      # checked against it (test/phone-zh.test.mjs skips without it), and the
      # phone edition the browser tests build carries it.
      - run: node scripts/fetch-cedict.mjs
      - run: node --test test/phone-zh.test.mjs
      - run: npm run test:browser
